name: coachmax_coach
description: CoachMax coaching workspace for sessions, players and conversations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  retrofit: ^4.9.2
  another_flushbar: ^2.2.4
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  loader_overlay: ^4.0.3
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  socket_io_client: ^2.0.0
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  chewie: ^1.13.1
  video_player_win: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
